statement: "For citations from claim-level evidence search, Galley requires a code-confirmed verbatim match to the cited work's abstract. The checker proposes the passage and a verifier from another family judges it supported, narrower or not supported. Galley narrows the claim for a narrower judgment and rejects the citation for a not-supported judgment. Model-run review citations use independently audited full-text passages. Galley takes the bibliographic record for a cited work with a DOI from the DOI registry."
