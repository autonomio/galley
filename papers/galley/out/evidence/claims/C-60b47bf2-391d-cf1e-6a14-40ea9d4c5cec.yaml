statement: "Peer review is run by agents from different families. Referee seats for methods, the host field, citations and the desk editor are drawn from families other than the author's and rotated between rounds, and each finding they raise carries a severity. The author answers each material finding by fixing it with exact edits, rebutting it, stating it as a limitation, or asking for new evidence. The referee who raised the finding judges the answer. If a finding is still disputed after a cap of answers (three in this run), a third family adjudicates. This run used two referee rounds, and every exchange is kept in the journal."
