statement: "Before anything is written, galley challenges the seed. One behaviour scores it on seven impact factors and names the weakest. Another proposes three structurally different directions that keep the seed's explicit commitments. A family other than the proposer then picks the original idea or one of the directions. After review, the finished paper is scored again. These scores are heuristic self-assessments, not predictions of impact."
