kind: "publication"
title: "DeepSurvey: Agent-Oriented Automated Survey Generation with Analytical Depth and Citation Reliability"
uri: "https://doi.org/10.48550/arxiv.2605.29522"
date: "2026"
locator: "abstract"
excerpt: "To enhance depth, DeepSurvey extracts structured keynotes, models cross-paper relationships through clustering and comparative analysis, and integrates a code-agent subsystem to recover implementation-level details. To fortify reliability, it combines citation-graph expansion with hybrid filtering for topic-focused retrieval, enforces evidence-constrained analysis and writing, and deploys multi-granularity agentic refinement to validate citation--claim alignment."
access: "inspected"
