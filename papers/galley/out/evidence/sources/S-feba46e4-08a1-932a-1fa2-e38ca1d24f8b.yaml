kind: "publication"
title: "Atypical Combinations and Scientific Impact"
uri: "https://doi.org/10.1126/science.1240474"
date: "2013"
locator: "abstract"
excerpt: "Our analysis of 17.9 million papers spanning all scientific fields suggests that science follows a nearly universal pattern: The highest-impact science is primarily grounded in exceptionally conventional combinations of prior work yet simultaneously features an intrusion of unusual combinations."
access: "inspected"
