kind: "publication"
title: "Fabrication and errors in the bibliographic citations generated by ChatGPT"
uri: "https://doi.org/10.1038/s41598-023-41032-5"
date: "2023"
locator: "abstract"
excerpt: "Within this set of documents, 55% of the GPT-3.5 citations but just 18% of the GPT-4 citations are fabricated. Likewise, 43% of the real (non-fabricated) GPT-3.5 citations but just 24% of the real GPT-4 citations include substantive citation errors."
