kind: "publication"
title: "How Atypical Combinations of Scientific Ideas Are Related to Impact: The General Case and the Case of the Field of Geography"
uri: "https://doi.org/10.1007/978-3-319-45023-0_12"
date: "2017"
locator: "abstract"
excerpt: "The authors’ analysis of 17.9 million papers spanning all scientific fields suggests that science follows a nearly universal pattern: The highest-impact science is primarily grounded in exceptionally conventional combinations of prior work, yet simultaneously features an intrusion of unusual combinations. Papers of this type were twice as likely to be highly cited works."
