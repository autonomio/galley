excerpt: "Every manuscript ends with its claim ledger, giving each claim's kind, standing, origin (seed or system) and sources, and with a production record generated from the run's journal. The run also writes a sign-off sheet of what only the authors can decide: declarations, claims the system added, claims stated as hypotheses, decisions a third family made, and skipped steps."
