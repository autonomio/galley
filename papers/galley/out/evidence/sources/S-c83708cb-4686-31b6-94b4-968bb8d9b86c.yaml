kind: "publication"
title: "Using Mutation Analysis for Assessing and Comparing Testing Coverage Criteria"
uri: "https://doi.org/10.1109/tse.2006.83"
date: "2006"
locator: "abstract"
excerpt: "One common practice is to seed faults in subject software, either manually or by using a program that generates all possible mutants based on a set of mutation operators. The latter allows the systematic, repeatable seeding of large numbers of faults, thus facilitating the statistical analysis of fault detection effectiveness of test suites; however, we do not know whether empirical results obtained this way lead to valid, representative conclusions."
