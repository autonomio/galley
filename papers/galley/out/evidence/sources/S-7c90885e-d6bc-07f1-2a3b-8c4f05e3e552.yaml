excerpt: "Scope-elastic compilation uses required behaviours to carry the manuscript to completion while verification sets the standing of claims marked as needing external evidence. A claim that exceeds its verified evidence is narrowed, given hypothesis standing, or listed for human sign-off. Failed verification does not halt the draft. With citation choices on, a claim can be held back pending a person's decision. Code enforces citation eligibility, while keeping prose within a claim's standing depends on drafting instructions and model judgments."
