kind: "publication"
title: "Fluency Without Fidelity: Errors in Citation-Attributed Claims in Large Language Model-Generated Literature Reviews in Mental Health"
uri: "https://doi.org/10.1007/s41347-026-00630-6"
date: "2026"
locator: "abstract"
excerpt: "Each citation-claim (N = 333) was extracted and independently evaluated against the cited source using a predefined accuracy scoring framework. Overall, 19.8% (n = 66) of citation-claims reflected fabrications, 18.3% (n = 61) contained major errors, 18.3% (n = 61) contained minor errors, and 43.5% (n = 145) were accurate."
