excerpt: "The evidence has clear limits. It is a single self-referential run with no external seeds and no single-family or prior-system baselines. The human-in-the-loop controls were not used (dial autonomous, citations automatic). Verification used abstracts only, so it can confirm no more than an abstract states. 'Ready for submission' means every gate held on one revision. It does not mean the claims are correct or that the paper will have impact."
