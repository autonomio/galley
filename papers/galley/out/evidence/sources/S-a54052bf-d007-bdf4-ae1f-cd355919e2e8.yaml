excerpt: "Based on the cited abstracts, we hypothesize that PaperOrchestra, The AI Scientist and DeepSciVerify each lack the combination of manuscript preparation that continues when an improver fails and is skipped, automatic narrowing or hedging of claims based on code-confirmed verbatim evidence, cross-family verification, and a human sign-off sheet. The proposed novelty is the combination. Earlier work established multi-agent drafting and automated review."
