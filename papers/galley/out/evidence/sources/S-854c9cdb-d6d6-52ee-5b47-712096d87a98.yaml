kind: "publication"
title: "OpenAlex: A fully-open index of scholarly works, authors, venues, institutions, and concepts"
uri: "https://doi.org/10.48550/arxiv.2205.01833"
date: "2022"
locator: "abstract"
excerpt: "OpenAlex is a new, fully-open scientific knowledge graph (SKG), launched to replace the discontinued Microsoft Academic Graph (MAG). It contains metadata for 209M works (journal articles, books, etc); 2013M disambiguated authors; 124k venues (places that host works, such as journals and online repositories); 109k institutions; and 65k Wikidata concepts (linked to works via an automated hierarchical multi-tag classifier)."
access: "inspected"
